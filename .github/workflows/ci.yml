name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'renovate.json'
      - '.github/dependabot.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release-drafter.yml'
      - '.github/workflows/pr-title.yml'
  # No paths-ignore here: the required checks must report on every PR, or a
  # docs-only PR can never merge. The `changes` job below decides whether
  # the expensive steps actually run.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a PR touches code. Keep the negated patterns in sync with
  # the push paths-ignore list above. GitHub's '**.md' becomes '**/*.md' here
  # because picomatch only treats '**' as a globstar when it is a whole path
  # segment.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists PR files through the API
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!renovate.json'
              - '!.github/dependabot.yml'
              - '!.github/workflows/docs.yml'
              - '!.github/workflows/publish.yml'
              - '!.github/workflows/release-drafter.yml'
              - '!.github/workflows/pr-title.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check netbox_rir_manager tests
      - run: uv run ruff format --check netbox_rir_manager tests

  # On docs-only PRs every leg still runs, so each `test (py, netbox)` check
  # reports, but all steps are skipped and the leg passes in seconds. A
  # job-level `if:` would report one unexpanded `test` check instead.
  test:
    runs-on: ubuntu-latest
    needs: [changes]
    permissions:
      contents: read
      id-token: write  # for Codecov OIDC upload
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        netbox:
          # renovate: datasource=github-releases depName=netbox-community/netbox
          - "4.5.10"
          # renovate: datasource=github-releases depName=netbox-community/netbox
          - "4.6.10"
          # renovate: datasource=github-releases depName=netbox-community/netbox
          - "4.7.5"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: ci-password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install NetBox v${{ matrix.netbox }}
        if: needs.changes.outputs.code == 'true'
        run: |
          git clone --depth 1 --branch v${{ matrix.netbox }} \
            https://github.com/netbox-community/netbox.git /tmp/netbox

      - name: Configure NetBox
        if: needs.changes.outputs.code == 'true'
        run: |
          cp .devcontainer/configuration/configuration.py /tmp/netbox/netbox/netbox/
          cat >> /tmp/netbox/netbox/netbox/configuration.py << 'EOF_PLUGINS'

          PLUGINS.append("netbox_rir_manager")
          PLUGINS_CONFIG["netbox_rir_manager"] = {}
          EOF_PLUGINS

          cat >> /tmp/netbox/netbox/netbox/configuration.py << 'EOF_DBREDIS'

          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': 'ci-password',
              'HOST': 'localhost',
              'PORT': '5432',
          }

          REDIS = {
              'tasks':   {'HOST': 'localhost', 'PORT': 6379, 'PASSWORD': '', 'DATABASE': 0, 'SSL': False},
              'caching': {'HOST': 'localhost', 'PORT': 6379, 'PASSWORD': '', 'DATABASE': 1, 'SSL': False},
          }
          EOF_DBREDIS

      - name: Install plugin and NetBox dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          uv venv
          uv pip install -r /tmp/netbox/requirements.txt
          uv pip install -e ".[dev]"
          # Activate the venv for all subsequent steps (uv run won't find
          # this project from /tmp/netbox/netbox, so we use plain `python`
          # backed by VIRTUAL_ENV + PATH).
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Run migrations
        if: needs.changes.outputs.code == 'true'
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
          SECRET_KEY: "abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*(-_=+)"
        run: |
          cd /tmp/netbox/netbox
          python manage.py migrate --noinput

      - name: Run pytest with coverage
        if: needs.changes.outputs.code == 'true'
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
          SECRET_KEY: "abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*(-_=+)"
        run: |
          pytest tests/ -v --tb=short --cov=netbox_rir_manager --cov-report=xml

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.code == 'true' && matrix.python == '3.13' && startsWith(matrix.netbox, '4.7.')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Fork PRs cannot read the secret, so a failed upload there is
          # expected and must not redden the build. Everywhere else a
          # rejected upload is a real problem: it silently stops the
          # coverage gate from voting, which is how tokenless uploads
          # rotted unnoticed.
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}

      - name: Check migrations
        if: needs.changes.outputs.code == 'true'
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
          SECRET_KEY: "abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*(-_=+)"
        run: |
          cd /tmp/netbox/netbox
          python manage.py makemigrations --check --dry-run

      - name: Django system check
        if: needs.changes.outputs.code == 'true'
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
          SECRET_KEY: "abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*(-_=+)"
        run: |
          cd /tmp/netbox/netbox
          python manage.py check

  build:
    runs-on: ubuntu-latest
    needs: [lint, changes]
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@v10.3.3
      - if: needs.changes.outputs.code == 'true'
        run: uv build
      - if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
